x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  gateway:
    image: nginx:1.29-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_healthy
      wukongim:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  admin:
    image: ${CHAT_ADMIN_IMAGE}
    expose:
      - "80"
    restart: unless-stopped
    logging: *default-logging

  migrate:
    image: ${CHAT_MIGRATE_IMAGE}
    env_file: ${CHAT_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  api:
    image: ${CHAT_API_IMAGE}
    env_file: ${CHAT_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      WUKONGIM_API_URL: http://wukongim:5001
      LIVEKIT_HTTP_URL: http://host.docker.internal:7880
      S3_ENDPOINT: http://minio:9000
    expose:
      - "3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      wukongim:
        condition: service_healthy
      livekit:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    logging: *default-logging

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging

  wukongim:
    image: ghcr.io/wukongim/wukongim:v2.2.5-20260422
    environment:
      WK_MODE: release
      WK_CLUSTER_NODEID: "1001"
      WK_TOKENAUTHON: "true"
      WK_WEBHOOK_HTTPADDR: http://api:3000/api/v1/webhooks/wukongim?token=${WUKONGIM_WEBHOOK_SECRET}
    expose:
      - "5001"
      - "5100"
      - "5200"
    ports:
      - "5100:5100"
    volumes:
      - wukongim_data:/home/wukongimdata
    healthcheck:
      test: ["CMD-SHELL", "wget -q -Y off -O /dev/null http://127.0.0.1:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging

  livekit:
    image: livekit/livekit-server:v1.13.5
    command: ["--config", "/etc/livekit/livekit.yaml"]
    network_mode: host
    volumes:
      - ./deploy/livekit/livekit.production.yaml:/etc/livekit/livekit.yaml:ro
      - ./deploy/certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7880"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    expose:
      - "9000"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc mb --ignore-existing "local/$$S3_BUCKET"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

volumes:
  postgres_data:
  wukongim_data:
  minio_data:
