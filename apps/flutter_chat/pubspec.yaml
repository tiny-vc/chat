name: flutter_chat
description: Flutter client for the WuKongIM and LiveKit chat server.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  chat_api_client:
    path: ../../clients/dart/chat_api
  audio_session: ^0.2.4
  dio: ^5.11.0
  crypto: ^3.0.7
  flutter_secure_storage: ^10.0.0
  file_picker: ^12.1.3
  just_audio: ^0.10.6
  livekit_client: ^2.11.0
  path_provider: ^2.1.6
  record: ^6.2.1
  uuid: ^4.6.0
  video_player: ^2.14.0
  url_launcher: ^6.3.2
  wukongimfluttersdk:
    path: ../../packages/wukongimfluttersdk
  image: ^4.5.4
  cross_file: ^0.3.5+5
  permission_handler: ^12.0.1

dependency_overrides:
  file_picker_darwin:
    path: ../../packages/file_picker_darwin

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
