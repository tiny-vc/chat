x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  gateway:
    image: nginx:1.29-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  admin:
    image: ${CHAT_ADMIN_IMAGE}
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  migrate:
    image: ${CHAT_MIGRATE_IMAGE}
    env_file: ${CHAT_ENV_FILE:-.env.production}
    restart: "no"
    logging: *default-logging

  api:
    image: ${CHAT_API_IMAGE}
    env_file: ${CHAT_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      PORT: "3000"
      INSTANCE_ROLE: api
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:3000/api/v1/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    logging: *default-logging

  worker:
    image: ${CHAT_API_IMAGE}
    env_file: ${CHAT_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      PORT: "3000"
      INSTANCE_ROLE: worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:3000/api/v1/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    logging: *default-logging
