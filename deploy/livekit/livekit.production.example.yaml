# Copy to livekit.production.yaml, replace every example value, and chmod 600.
# This file is intentionally not used by the local development stack.
port: 7880
log_level: info

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true

keys:
  replace-with-livekit-key: replace-with-livekit-secret

webhook:
  api_key: replace-with-livekit-key
  urls:
    - https://chat.example.com/api/v1/webhooks/livekit

turn:
  enabled: true
  domain: turn.example.com
  # A single public IP already uses TCP 443 for HTTPS/WSS at Nginx.
  tls_port: 5349
  udp_port: 443
  cert_file: /certs/fullchain.pem
  key_file: /certs/privkey.pem
